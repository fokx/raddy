[package]
name = "raddy-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
arc-swap = "1"
inventory = "0.3"
tracing = "0.1"
http = "1"
bytes = "1"
regex = "1"
ipnet = "2"
