[package]
name = "raddyserver"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Alias and wrapper for raddy-server, the fast, extensible web server in Rust (Caddy drop-in replacement)"
repository = "https://github.com/fokx/raddy"
homepage = "https://github.com/fokx/raddy"
readme = "README.md"
keywords = ["caddy", "web-server", "reverse-proxy", "http3", "acme"]
categories = ["web-programming::http-server", "network-programming"]

[[bin]]
name = "raddy"
path = "src/bin/raddy.rs"

[[bin]]
name = "raddyserver"
path = "src/bin/raddyserver.rs"

[dependencies]
raddy-server = { version = "0.3.0", path = "../.." }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
