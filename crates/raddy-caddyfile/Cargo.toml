[package]
name = "raddy-caddyfile"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Caddyfile lexer, parser, preprocessor, and JSON adapter for Raddy"
repository = "https://github.com/fokx/raddy"
readme = "README.md"
keywords = ["caddy", "caddyfile", "parser", "lexer", "raddy"]
categories = ["parser-implementations", "config"]

[dependencies]
raddy-core = { version = "0.4.0", path = "../raddy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
regex = "1"
glob = "0.3.4"
base64 = "0.22"
