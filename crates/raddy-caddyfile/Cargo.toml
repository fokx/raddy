[package]
name = "raddy-caddyfile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Caddyfile lexer, parser, preprocessor, and JSON adapter for Raddy"
readme = "README.md"
keywords = ["caddy", "caddyfile", "parser", "lexer", "raddy"]
categories = ["parser-implementations", "config"]

[dependencies]
raddy-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
regex = "1"
glob = "0.3.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
