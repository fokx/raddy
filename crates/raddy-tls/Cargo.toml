[package]
name = "raddy-tls"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Automated TLS, ACME client, local CA PKI, and SNI resolution for Raddy"
repository = "https://github.com/fokx/raddy"
readme = "README.md"
keywords = ["caddy", "tls", "acme", "letsencrypt", "raddy"]
categories = ["network-programming", "cryptography"]

[dependencies]
raddy-core = { version = "0.4.0", path = "../raddy-core" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = "0.13"
instant-acme = "0.8"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
ipnet = "2"
ring = "0.17"
regex = "1"
pem = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
