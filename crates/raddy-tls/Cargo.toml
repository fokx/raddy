[package]
name = "raddy-tls"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
raddy-core = { path = "../raddy-core" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = "0.13"
instant-acme = "0.8"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
ipnet = "2"
ring = "0.17"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
