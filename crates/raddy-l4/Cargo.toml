[package]
name = "raddy-l4"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Layer 4 (TCP/UDP) transport application for Raddy (caddy-l4 parity)"
readme = "README.md"
keywords = ["caddy", "layer4", "l4", "proxy", "raddy"]
categories = ["network-programming"]

[dependencies]
raddy-core = { workspace = true }
raddy-tls = { workspace = true }
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
socket2 = "0.6"
ipnet = "2"
regex = "1"
parking_lot = "0.12"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
