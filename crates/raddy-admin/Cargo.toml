[package]
name = "raddy-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Axum REST Admin API and zero-downtime hot reload engine for Raddy"
readme = "README.md"
keywords = ["caddy", "admin-api", "hot-reload", "axum", "raddy"]
categories = ["web-programming::http-server"]

[dependencies]
raddy-core = { workspace = true }
raddy-caddyfile = { workspace = true }
raddy-http = { workspace = true }
raddy-tls = { workspace = true }
raddy-proxy = { workspace = true }
raddy-l4 = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
parking_lot = "0.12"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
http = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
