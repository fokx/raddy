[package]
name = "raddy-admin"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Axum REST Admin API and zero-downtime hot reload engine for Raddy"
repository = "https://github.com/fokx/raddy"
readme = "README.md"
keywords = ["caddy", "admin-api", "hot-reload", "axum", "raddy"]
categories = ["web-programming::http-server"]

[dependencies]
raddy-core = { version = "0.2.0", path = "../raddy-core" }
raddy-caddyfile = { version = "0.2.0", path = "../raddy-caddyfile" }
raddy-http = { version = "0.2.0", path = "../raddy-http" }
raddy-tls = { version = "0.2.0", path = "../raddy-tls" }
raddy-proxy = { version = "0.2.0", path = "../raddy-proxy" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
parking_lot = "0.12"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
http = "1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
