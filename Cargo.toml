[package]
name = "raddy-server"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Fast, extensible, memory-safe web server and reverse proxy in Rust (Caddy drop-in replacement)"
repository = "https://github.com/fokx/raddy"
homepage = "https://github.com/fokx/raddy"
readme = "README.md"
keywords = ["caddy", "web-server", "reverse-proxy", "http3", "acme"]
categories = ["web-programming::http-server", "network-programming"]

[lib]
name = "raddy_server"
path = "src/lib.rs"

[[bin]]
name = "raddy"
path = "src/main.rs"

[workspace]
members = [
    "crates/raddy-core",
    "crates/raddy-caddyfile",
    "crates/raddy-http",
    "crates/raddy-tls",
    "crates/raddy-proxy",
    "crates/raddy-admin",
    "crates/raddyserver",
]

[dependencies]
raddy-core = { version = "0.2.0", path = "crates/raddy-core" }
raddy-caddyfile = { version = "0.2.0", path = "crates/raddy-caddyfile" }
raddy-http = { version = "0.2.0", path = "crates/raddy-http" }
raddy-tls = { version = "0.2.0", path = "crates/raddy-tls" }
raddy-proxy = { version = "0.2.0", path = "crates/raddy-proxy" }
raddy-admin = { version = "0.2.0", path = "crates/raddy-admin" }

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
notify = "8"
bcrypt = "0.17"

[dev-dependencies]
bytes = "1"
http = "1"
axum = "0.8"
tower = "0.5"
