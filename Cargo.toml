[package]
name = "raddy-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "raddy"
path = "src/main.rs"

[workspace]
members = [
    "crates/raddy-core",
    "crates/raddy-caddyfile",
    "crates/raddy-http",
    "crates/raddy-tls",
    "crates/raddy-proxy",
]

[dependencies]
raddy-core = { path = "crates/raddy-core" }
raddy-caddyfile = { path = "crates/raddy-caddyfile" }
raddy-http = { path = "crates/raddy-http" }
raddy-tls = { path = "crates/raddy-tls" }
raddy-proxy = { path = "crates/raddy-proxy" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
